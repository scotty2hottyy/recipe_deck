name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Analyze, test, build, and run integration test
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run widget and unit tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-}"
          echo "ADB_SERVER_SOCKET=${ADB_SERVER_SOCKET:-<unset>}"

      - name: Check ADB and emulator environment
        run: |
          unset ADB_SERVER_SOCKET
          adb version
          adb kill-server || true
          adb start-server
          adb devices -l
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install Android emulator system image
        run: |
          unset ADB_SERVER_SOCKET
          yes | sdkmanager --licenses
          yes | sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-30" \
            "system-images;android-30;default;x86_64"

      - name: Install Android emulator system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Check installed Android emulator tools
        run: |
          unset ADB_SERVER_SOCKET
          adb version
          emulator -version
          emulator -accel-check
          adb devices -l
          ls -l /dev/kvm

      - name: Create Android emulator AVD
        run: |
          unset ADB_SERVER_SOCKET
          echo "no" | avdmanager create avd \
            --force \
            --name recipe_deck_api_30 \
            --package "system-images;android-30;default;x86_64"
          avdmanager list avd
          emulator -list-avds

      - name: Start Android emulator
        run: |
          unset ADB_SERVER_SOCKET
          adb kill-server || true
          adb start-server
          nohup emulator -avd recipe_deck_api_30 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "Started Android emulator process with PID $EMULATOR_PID."
          sleep 5
          if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
            echo "Emulator process exited before registering with ADB."
            cat "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi

          emulator_serial=""
          for attempt in {1..24}; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited while waiting for ADB registration."
              cat "$RUNNER_TEMP/emulator.log" || true
              exit 1
            fi

            adb_output="$(adb devices 2>&1 || true)"
            emulator_serial="$(printf '%s\n' "$adb_output" | awk '/^emulator-[0-9]+[[:space:]]+device([[:space:]]|$)/ { print $1; exit }')"
            if [ -n "$emulator_serial" ]; then
              echo "Emulator registered with ADB as $emulator_serial."
              adb devices -l
              break
            fi

            echo "Waiting for emulator to register with ADB... attempt $attempt/24"
            printf '%s\n' "$adb_output"
            sleep 5
          done

          if [ -z "$emulator_serial" ]; then
            echo "Emulator did not register with ADB before timeout."
            adb devices -l || true
            cat "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi

          boot_completed=""
          for attempt in {1..60}; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited while waiting for Android boot."
              cat "$RUNNER_TEMP/emulator.log" || true
              exit 1
            fi

            boot_completed="$(adb -s "$emulator_serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$boot_completed" = "1" ]; then
              adb devices -l
              adb -s "$emulator_serial" shell settings put global window_animation_scale 0 || true
              adb -s "$emulator_serial" shell settings put global transition_animation_scale 0 || true
              adb -s "$emulator_serial" shell settings put global animator_duration_scale 0 || true
              exit 0
            fi
            echo "Waiting for emulator boot... attempt $attempt/60, sys.boot_completed=${boot_completed:-<empty>}"
            sleep 10
          done
          echo "Emulator failed to boot before timeout."
          adb devices -l || true
          cat "$RUNNER_TEMP/emulator.log" || true
          exit 1

      - name: Run Android integration test
        run: |
          unset ADB_SERVER_SOCKET
          flutter test integration_test/app_test.dart -d emulator-5554

      - name: Shut down Android emulator
        if: always()
        run: |
          unset ADB_SERVER_SOCKET
          adb devices -l || true
          adb -s emulator-5554 emu kill || true
          cat "$RUNNER_TEMP/emulator.log" || true
